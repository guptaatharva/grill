<text font-family="Inter, sans-serif" font-size="22" fill="#f3ece4"><tspan x="966" y="578">The UPDATE already ran, so stock drops</tspan><tspan x="966" y="612">but no order exists. The catch block never</tspan><tspan x="966" y="646">calls rollback, and conn.release() is</tspan><tspan x="966" y="680">missing on both paths</tspan><tspan fill="#ff7a2f">|</tspan></text>
