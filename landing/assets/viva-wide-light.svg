<text font-family="Inter, sans-serif" font-size="30" font-weight="600" fill="#1e1915">
<tspan x="940" y="300">You open a transaction on line 44.</tspan>
<tspan x="940" y="344">What happens to the stock count</tspan>
<tspan x="940" y="388">if the insert on line 51 throws,</tspan>
<tspan x="940" y="432">and where is the connection</tspan>
<tspan x="940" y="476">released?</tspan></text>
